    <marker id="k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#212326"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#750014"/></marker>
  </defs>
  <!-- inputs -->
  <rect x="64" y="14" width="440" height="36" rx="10" fill="#F7F6F0" stroke="#DDD9CB" stroke-width="1.5"/>
