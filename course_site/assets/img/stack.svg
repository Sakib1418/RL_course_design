<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#565029"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#750014"/></marker>
    <marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1F3A52"/></marker>
    <clipPath id="vessel"><rect x="398" y="128" width="124" height="222" rx="36"/></clipPath>
  </defs>
  <text x="24" y="34" font-size="11.5" font-weight="700" letter-spacing="2" fill="#5B636B">ONE STACK · THREE COURSES</text>

  <!-- cards -->
  <g>
    <rect x="24" y="56" width="300" height="92" rx="14" fill="#fff" stroke="#DDD9CB" stroke-width="1.5"/>
    <circle cx="72" cy="102" r="22" fill="#565029"/><text x="72" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">03</text>
    <text x="108" y="96" font-size="17" font-weight="700" fill="#212326" font-family="'Source Serif 4', Georgia, serif">Agentic AI</text>
    <text x="108" y="118" font-size="12.5" fill="#5B636B">reasons over SOPs and data, proposes</text>
  </g>
  <g>
    <rect x="24" y="176" width="300" height="92" rx="14" fill="#fff" stroke="#DDD9CB" stroke-width="1.5"/>
    <circle cx="72" cy="222" r="22" fill="#750014"/><text x="72" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">01</text>
    <text x="108" y="216" font-size="17" font-weight="700" fill="#212326" font-family="'Source Serif 4', Georgia, serif">Reinforcement learning</text>
    <text x="108" y="238" font-size="12.5" fill="#5B636B">learns a policy, decides and acts</text>
  </g>
  <g>
    <rect x="24" y="296" width="300" height="92" rx="14" fill="#fff" stroke="#DDD9CB" stroke-width="1.5"/>
    <circle cx="72" cy="342" r="22" fill="#1F3A52"/><text x="72" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">02</text>
    <text x="108" y="336" font-size="17" font-weight="700" fill="#212326" font-family="'Source Serif 4', Georgia, serif">Digital twin</text>
    <text x="108" y="358" font-size="12.5" fill="#5B636B">simulates, verifies, stays honest</text>
  </g>

  <!-- arrows to process -->
  <path d="M326 102 C360 102 362 170 392 172" fill="none" stroke="#565029" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#aO)"/>
  <text x="338" y="92" font-size="11" font-weight="700" letter-spacing="1" fill="#565029">PROPOSE</text>
  <path d="M326 222 C356 222 362 240 392 240" fill="none" stroke="#750014" stroke-width="2.5" marker-end="url(#aM)"/>
  <text x="340" y="212" font-size="11" font-weight="700" letter-spacing="1" fill="#750014">ACT</text>
  <path d="M330 342 C360 342 362 306 390 306" fill="none" stroke="#1F3A52" stroke-width="2.5" marker-start="url(#aN)" marker-end="url(#aN)"/>
  <text x="340" y="296" font-size="11" font-weight="700" letter-spacing="1" fill="#1F3A52">SYNC</text>

  <!-- bioreactor -->
  <rect x="440" y="94" width="40" height="30" rx="6" fill="#212326"/>
  <g clip-path="url(#vessel)">
    <rect x="398" y="128" width="124" height="222" fill="#fff"/>
    <path d="M398 206 q15.5 -9 31 0 t31 0 t31 0 t31 0 V352 H398 Z" fill="#EAE8DA"/>
    <g fill="#fff" stroke="#8B959E" stroke-width="1.2">
      <circle cx="420" cy="320" r="4"/><circle cx="432" cy="290" r="3"/><circle cx="498" cy="312" r="4.5"/><circle cx="488" cy="262" r="3"/><circle cx="424" cy="246" r="3.5"/><circle cx="502" cy="228" r="2.5"/>
    </g>
  </g>
  <rect x="398" y="128" width="124" height="222" rx="36" fill="none" stroke="#212326" stroke-width="2.5"/>
  <line x1="460" y1="124" x2="460" y2="306" stroke="#212326" stroke-width="3"/>
  <rect x="430" y="300" width="60" height="9" rx="4.5" fill="#212326"/>
  <rect x="438" y="252" width="44" height="7" rx="3.5" fill="#212326"/>
  <line x1="506" y1="110" x2="506" y2="270" stroke="#750014" stroke-width="2"/><circle cx="506" cy="272" r="5" fill="#750014"/>
  <text x="460" y="378" text-anchor="middle" font-size="14" font-weight="700" fill="#212326">Your process</text>
  <text x="460" y="396" text-anchor="middle" font-size="12" fill="#5B636B">bioreactor · CSTR · plant</text>

  <text x="24" y="432" font-size="12.5" font-style="italic" fill="#5B636B">Every action is checked on the twin before it reaches the process.</text>
</svg>
