  <g stroke="#565029" stroke-width="2" marker-end="url(#g)"><line x1="134" y1="50" x2="134" y2="78"/><line x1="284" y1="50" x2="284" y2="78"/><line x1="434" y1="50" x2="434" y2="78"/></g>

  <!-- specialists -->
  <g font-size="12.5">
    <rect x="70" y="82" width="128" height="54" rx="10" fill="#fff" stroke="#565029" stroke-width="2"/>
    <text x="134" y="104" text-anchor="middle" font-weight="700" fill="#565029">Knowledge</text><text x="134" y="122" text-anchor="middle" font-size="11" fill="#5B636B">retrieves · cites</text>
    <rect x="220" y="82" width="128" height="54" rx="10" fill="#fff" stroke="#565029" stroke-width="2"/>
    <text x="284" y="104" text-anchor="middle" font-weight="700" fill="#565029">Data</text><text x="284" y="122" text-anchor="middle" font-size="11" fill="#5B636B">queries trends</text>
    <rect x="370" y="82" width="128" height="54" rx="10" fill="#fff" stroke="#565029" stroke-width="2"/>
    <text x="434" y="104" text-anchor="middle" font-weight="700" fill="#565029">Simulation</text><text x="434" y="122" text-anchor="middle" font-size="11" fill="#5B636B">runs the twin</text>
  </g>
  <g fill="none" stroke="#565029" stroke-width="2"><path d="M134 136 C134 156 284 150 284 166"/><path d="M434 136 C434 156 284 150 284 166"/><line x1="284" y1="136" x2="284" y2="166"/></g>

  <!-- master -->
  <rect x="174" y="166" width="220" height="54" rx="12" fill="#565029"/>
  <text x="284" y="189" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2" fill="#fff">MASTER AGENT</text>
  <text x="284" y="208" text-anchor="middle" font-size="11.5" fill="#EFEEE2">plans · delegates · proposes</text>
  <line x1="284" y1="220" x2="284" y2="244" stroke="#212326" stroke-width="2" marker-end="url(#k)"/>

