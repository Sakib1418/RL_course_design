  <rect x="174" y="248" width="220" height="54" rx="12" fill="#1F3A52"/>
  <path d="M196 275 l7 7 l13 -14" fill="none" stroke="#9FD3B8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
