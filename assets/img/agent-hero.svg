  <text x="294" y="290" text-anchor="middle" font-size="11.5" fill="#D7E1EA">balances · constraints · safety</text>
  <path d="M394 275 H440 Q456 275 456 259 V209 Q456 193 440 193 H398" fill="none" stroke="#750014" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>
