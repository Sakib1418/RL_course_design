  <rect x="224" y="412" width="120" height="32" rx="16" fill="#212326"/>
  <text x="284" y="433" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#fff">PROCESS</text>

  <!-- feedback -->
  <path d="M174 357 H48 Q34 357 34 343 V123 Q34 109 48 109 H64" fill="none" stroke="#565029" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#g)"/>
  <text transform="translate(24 236) rotate(-90)" text-anchor="middle" font-size="11" font-weight="600" fill="#565029">decisions become training data</text>
