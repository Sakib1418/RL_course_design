<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#750014"/></marker>
    <marker id="n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F3A52"/></marker>
    <clipPath id="v"><rect x="200" y="222" width="120" height="150" rx="30"/></clipPath>
  </defs>
  <!-- agent -->
  <rect x="160" y="22" width="200" height="100" rx="16" fill="#750014"/>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#F1C6CC">AGENT</text>
  <text x="260" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="'Source Serif 4', Georgia, serif">policy π(a | s)</text>
  <text x="260" y="104" text-anchor="middle" font-size="12" fill="#F6E9EA">learns by trial and reward</text>

  <!-- loops -->
  <path d="M158 72 H100 Q70 72 70 102 V265 Q70 295 100 295 H194" fill="none" stroke="#750014" stroke-width="3" marker-end="url(#m)"/>
  <rect x="14" y="160" width="112" height="46" rx="10" fill="#fff" stroke="#750014" stroke-width="2"/>
  <text x="70" y="179" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#750014">ACTION</text>
  <text x="70" y="197" text-anchor="middle" font-size="13" fill="#212326">feed rate</text>

  <path d="M326 295 H420 Q450 295 450 265 V102 Q450 72 420 72 H366" fill="none" stroke="#1F3A52" stroke-width="3" marker-end="url(#n)"/>
  <rect x="370" y="130" width="146" height="46" rx="10" fill="#fff" stroke="#1F3A52" stroke-width="2"/>
  <text x="443" y="149" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#1F3A52">STATE</text>
  <text x="443" y="167" text-anchor="middle" font-size="12" fill="#212326">biomass · substrate · DO</text>
  <rect x="370" y="198" width="146" height="46" rx="10" fill="#fff" stroke="#1F3A52" stroke-width="2"/>
  <text x="443" y="217" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#1F3A52">REWARD</text>
  <text x="443" y="235" text-anchor="middle" font-size="12" fill="#212326">enzyme titer</text>

  <!-- bioreactor -->
  <rect x="240" y="198" width="40" height="24" rx="5" fill="#212326"/>
  <g clip-path="url(#v)">
    <rect x="200" y="222" width="120" height="150" fill="#fff"/>
    <path d="M200 268 q15 -8 30 0 t30 0 t30 0 t30 0 V374 H200 Z" fill="#F6E9EA"/>
    <g fill="#fff" stroke="#B88A92" stroke-width="1.2"><circle cx="222" cy="340" r="4"/><circle cx="296" cy="330" r="4.5"/><circle cx="230" cy="300" r="3"/><circle cx="290" cy="292" r="3"/></g>
  </g>
  <rect x="200" y="222" width="120" height="150" rx="30" fill="none" stroke="#212326" stroke-width="2.5"/>
  <line x1="260" y1="222" x2="260" y2="340" stroke="#212326" stroke-width="3"/>
  <rect x="234" y="334" width="52" height="8" rx="4" fill="#212326"/>
  <text x="260" y="398" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="2" fill="#212326">ENVIRONMENT</text>
  <text x="260" y="416" text-anchor="middle" font-size="12" fill="#5B636B">fed-batch bioreactor</text>

  <!-- snake inset -->
  <rect x="18" y="318" width="112" height="76" rx="8" fill="#212326"/>
  <g fill="#fff"><rect x="32" y="352" width="9" height="9"/><rect x="42" y="352" width="9" height="9"/><rect x="52" y="352" width="9" height="9"/><rect x="62" y="352" width="9" height="9"/><rect x="62" y="342" width="9" height="9"/><rect x="62" y="332" width="9" height="9"/></g>
  <rect x="100" y="368" width="9" height="9" fill="#E0314B"/>
  <text x="74" y="414" text-anchor="middle" font-size="11" fill="#5B636B">Week 1: the same loop</text>
</svg>
